[project]
name = "net-sci-epi"
version = "0.1.0"
description = "Ciência das redes para análise de séries temporais epidemiológicas agregadas em regiões geográficas."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Vinícius", email = "viniciusnvcosta47@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "pmdarima>=2.1.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "networkx>=3.4", # construção e features do grafo L0 (S, A, M, Φ)
    "geopandas", # geometrias e operações espaciais (camada A)
    "libpysal", # contiguidade espacial (queen/rook)
    "geobr", # download das malhas oficiais do IBGE
    "openpyxl", # leitura das tabelas REGIC (.xlsx)
    "scipy>=1.18.1",
    "pyarrow>=25.0.1",
    "pyod>=3.6.6",
    "river>=0.26.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "python-igraph",
    "pymnet",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "hatchling>=1.32.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/headd_l0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-m 'not slow and not reference and not integration'"
markers = [
    "slow: scientific gates and expensive checks",
    "reference: requires the external pinned CDADE reference",
    "integration: exercises external environments",
]

[tool.ruff.format]
# Plan and spec Markdown keeps compact illustrative snippets; format code only.
exclude = ["*.md"]
